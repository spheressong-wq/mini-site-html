<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>

    <style>
        body {background-color:#261d38;  font-family: Arial, sans-serif; color: #f9f7f7; text-align: center; max-width: 800px; margin: 0 auto; padding: 20px; }


        form {background-color: #402645; padding: 20px; border-radius: 20px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }

        header { padding: 20px; border-radius:20px; margin-bottom:20px;}

        header {display: inline-block; text-align: left; padding-left: 20px; margin: 12px auto;}

        
        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }

        /* o justify-content, center, pareceu centralizar mais a lista de links em cima */

        nav a {
        color: #f8dce5;
        background: #38243e;
        padding: 8px 14px;
        border: 1px solid #69445f;
        border-radius: 999px;
        text-decoration: none;
        transition: background-color 0.2s, transform 0.2s;}

      nav a:hover {
      background: #70435f;
     transform: translateY(-2px);}

        nav a:focus-visible {
     outline: 2px solid #f08a9d;
     outline-offset: 3px;}

     
         nav ul {
  display: flex;
  justify-content: center;
  text-align: left;
  gap: 20px;
  padding: 0;
  list-style: none;
  flex-direction: column;}


     button[type="submit"] {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 16px;
  margin: 16px auto 0;
  color: #f8dce5;
  background: #38243e;
  padding: 8px 14px;
  border: 1px solid #69445f;
  border-radius: 999px;
  text-decoration: none;
  transition: background-color 0.2s, transform 0.2s;
  outline-offset: 3px;
  text-align: center;
}

button[type="submit"]:hover {
  background: #70435f;
  transform: translateY(-2px);
}

    /* O CSS do botão do formulário quase não funcionou, provavelmente porque declarei a cor do background duas vezes. Até guardei o original para comparar depois */

    /* Outra observação é que o text-align (center) não vale para centralizar na página, ou melhor - ele centralizou o texto dentro do botão. Para mudar o lugar do botão em si, usei "margin: 16px auto 0;" */

    </style>
</head>

<body>
    
     <header> 

         <h1 style="font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;  color:#dd6d7a"> Contatos </h1>

        <nav>
         <ul>
    <li><a href="index.html">Página inicial</a></li>
    <li><a href="sobre.html">Sobre</a></li>
    <li><a href="contato.html">Contato</a></li>
          </ul>
        </nav>

    </header>

    <main>
        <section>
            <form>

                <fieldset>
                    <legend style="font-family:cursive"> Receba nossa <strong> newsletter</strong> no seu e-mail!</legend>
                    <label for="e-mail"> E-mail:</label>
                    <input type="email" name="email" id="e-mail"> <br>

                    <label>
                        <input type="checkbox" name="termos" id="termos" > 
                        Aceito os termos de uso
                    </label>
                </fieldset>

                <button type="submit" aria-required="true">Enviar</button>
            </form>
        </section>
    </main>

</body>
</html>
